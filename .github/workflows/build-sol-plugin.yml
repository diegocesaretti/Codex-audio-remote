name: build-sol-plugin

on:
  push:
    branches: [ feat/sol-plugin-port, feat/sol-native-audio-identity, feat/realtime-session-lifecycle ]
  pull_request:
    branches: [ feat/sol-plugin-port ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Apply captured official Codex realtime flow
        shell: pwsh
        run: ./scripts/prepare-official-realtime.ps1

      - name: Bind persisted runtime settings
        shell: pwsh
        run: ./scripts/apply-runtime-settings.ps1

      - name: Route V3 audio through WebRTC media track
        shell: pwsh
        run: ./scripts/prepare-webrtc-media-audio.ps1

      - name: Instrument WebRTC audio flow
        shell: pwsh
        run: ./scripts/instrument-webrtc-audio.ps1

      - name: Layer SOL Home Assistant context and native voice style
        shell: pwsh
        run: ./scripts/apply-ha-context-to-working-v3.ps1

      - name: Layer Realtime-only SOL plugin mode
        shell: pwsh
        run: ./scripts/prepare-sol-plugin-mode.ps1

      - name: Layer transcript-driven voice session lifecycle
        shell: pwsh
        run: ./scripts/add-sol-voice-session-lifecycle.ps1

      - name: Finalize SOL native callback routing, audio quality and stability
        shell: pwsh
        run: ./scripts/finalize-sol-native-runtime.ps1

      - name: Replace HTTP.sys listener with Kestrel
        shell: pwsh
        run: ./scripts/use-kestrel-for-sol-plugin.ps1

      - name: Verify golden V3 and clean native plugin invariants
        shell: pwsh
        run: |
          $bridge = Get-Content windows/CodexAudioRemote.Server/CodexRealtimeBridge.cs -Raw
          $server = Get-Content windows/CodexAudioRemote.Server/RealtimeSessionServer.cs -Raw
          $pluginHostSource = Get-Content windows/CodexAudioRemote.Server/SolPluginHost.cs -Raw
          $solRuntime = Get-Content windows/CodexAudioRemote.Server/SolRuntimeBridge.cs -Raw
          $solHa = Get-Content windows/CodexAudioRemote.Server/SolHomeAssistantContext.cs -Raw
          $voiceStyle = Get-Content windows/CodexAudioRemote.Server/SolVoiceStyle.cs -Raw
          $voiceLifecycle = Get-Content windows/CodexAudioRemote.Server/SolVoiceSessionSettings.cs -Raw
          $audioQuality = Get-Content windows/CodexAudioRemote.Server/SolAudioQualitySettings.cs -Raw
          $manifest = Get-Content sol-plugin/sol-plugin.json -Raw
          $project = Get-Content windows/CodexAudioRemote.SolPlugin/CodexAudioRemote.SolPlugin.csproj -Raw
          $entry = Get-Content windows/CodexAudioRemote.SolPlugin/Program.cs -Raw

          if ($bridge -notmatch 'RealtimeVersion = "v3"') { throw 'REGRESSION: V3 missing' }
          if ($bridge -notmatch 'RealtimeModel = "gpt-live-1-codex"') { throw 'REGRESSION: model changed' }
          if ($bridge -notmatch 'type = "webrtc"') { throw 'REGRESSION: official WebRTC transport missing' }
          if ($bridge -match 'type = "existingCall"') { throw 'REGRESSION: existingCall reintroduced' }
          if ($bridge -match 'directRealtimeCall\.CreateAsync') { throw 'REGRESSION: direct ChatGPT realtime/calls reintroduced' }
          if ($bridge -notmatch 'StartOrResumeThreadAsync\(cwd, cancellationToken\)') { throw 'REGRESSION: thread continuity changed' }
          if ($bridge -notmatch 'realtimeStartInstructions') { throw 'Realtime instruction channel missing' }
          if ($bridge -notmatch 'SolVoiceStyle\.Instructions') { throw 'Native voice style is not wired into Realtime instructions' }
          if ($bridge -notmatch 'SolHomeAssistantContext\.GetContextAsync') { throw 'SOL mode does not consume HA context through plugin bus' }
          if ($bridge -match 'thread/realtime/appendAudio') { throw 'Legacy sideband audio append survived' }
          if ($bridge -notmatch 'oauthWebRtcPeer\.PushPcmAsync') { throw 'WebRTC PCM uplink missing' }
          if ($server -match 'TrayController|AudioCableSink|LoopbackDownlink|BtcomBluetoothReconnect') { throw 'Legacy desktop audio dependency survived in Realtime server' }
          if ($server -notmatch 'SolRuntimeBridge\.TryCreate') { throw 'SOL runtime bridge missing' }
          if ($server -notmatch 'TryHandleCallbackAsync') { throw 'SOL MCP callback routing missing' }
          if ($server -match 'HttpListener') { throw 'HTTP.sys/HttpListener survived; plugin would require URLACL/admin' }
          if ($server -notmatch 'WebApplication\.CreateSlimBuilder') { throw 'Kestrel host missing' }
          if ($server -notmatch 'ListenAnyIP\(options.Port\)') { throw 'Kestrel LAN binding missing' }
          if ($server -notmatch '"paused"') { throw 'PAUSED/working state missing' }
          if ($server -notmatch 'ScheduleMaxListenTimeout') { throw 'Maximum listening timer missing' }
          if ($server -notmatch 'ScheduleSilenceTimeout') { throw 'Silence timer missing' }
          if ($server -notmatch 'ScheduleWorkTimeout') { throw 'Work timer missing' }
          if ($server -notmatch 'ScheduleSessionTimeout') { throw 'Absolute session timer missing' }
          if ($server -notmatch 'session_timeout') { throw 'Absolute session timeout transition missing' }
          if ($server -notmatch 'ScheduleEndPhraseGraceTimeout') { throw 'End phrase farewell grace timer missing' }
          if ($server -notmatch 'PauseForEndPhraseAsync') { throw 'End phrase pause path missing' }
          if ($server -notmatch 'end_phrase_grace') { throw 'End phrase farewell close transition missing' }
          if ($server -notmatch 'SolVoiceSessionSettings\.MatchEndPhrase') { throw 'Transcript end-phrase detection missing' }
          if ($server -notmatch 'wake_reset') { throw 'Wake reset while listening missing' }
          if ($server -notmatch 'wake_resume') { throw 'Wake resume from PAUSED missing' }
          if ($server -notmatch 'SolAudioQualitySettings\.ProcessDownlink') { throw 'Configurable downlink quality pipeline missing' }
          if ($server -match 'ToAndroid16k\(pcm, sourceRate\)') { throw 'REGRESSION: forced 16 kHz downlink reintroduced' }
          if ($server -notmatch 'ScheduleTransportLossGrace') { throw 'Transport reconnect grace missing' }
          if ($server -notmatch 'transport_lost_timeout') { throw 'Transport reconnect timeout transition missing' }
          if ($server -match 'await EndSessionAsync\("transport_lost"\)') { throw 'REGRESSION: immediate transport-lost shutdown reintroduced' }
          if ($solRuntime -match 'HttpListener(Context|Request|Response)') { throw 'SOL MCP callback still uses HttpListener types' }
          if ($solRuntime -match '_ = SetInputStatusAsync\("disconnected"\)') { throw 'Disposed SemaphoreSlim race survived' }
          if ($pluginHostSource -notmatch 'sol\.plugin\.ready') { throw 'SOL plugin protocol helper missing' }
          if ($solRuntime -notmatch 'codex_audio_remote_bind_current_speaker') { throw 'Speaker binding MCP tool missing' }
          if ($solRuntime -notmatch 'codex_audio_remote_list_people') { throw 'Canonical SOL Person listing tool missing' }
          if ($solRuntime -notmatch '/v1/plugin-api/identities/people') { throw 'Canonical SOL Person API missing' }
          if ($solHa -notmatch '/v1/plugin-api/mcp/tools/invoke-read') { throw 'HA context does not use read-only plugin bus' }
          if ($voiceStyle -notmatch 'voice_style') { throw 'Voice style setting reader missing' }
          if ($voiceStyle -notmatch 'flirty') { throw 'Flirty preset missing' }
          if ($voiceLifecycle -notmatch 'DefaultListenTimeoutSeconds = 16') { throw 'Listen timeout default missing' }
          if ($voiceLifecycle -notmatch 'DefaultSilenceTimeoutSeconds = 8') { throw 'Silence timeout default missing' }
          if ($voiceLifecycle -notmatch 'DefaultWorkTimeoutSeconds = 30') { throw 'Work timeout default missing' }
          if ($voiceLifecycle -notmatch 'DefaultSessionTimeoutSeconds = 40') { throw 'Absolute session timeout default missing' }
          if ($voiceLifecycle -notmatch 'DefaultEndPhraseGraceSeconds = 3') { throw 'End phrase farewell grace default missing' }
          if ($voiceLifecycle -notmatch 'DefaultEndPhrases = "chau, gracias"') { throw 'Default end phrases missing' }
          if ($audioQuality -notmatch 'DefaultQuality = "high"') { throw 'High-fidelity default missing' }
          if ($audioQuality -notmatch '"balanced" => 24000') { throw '24 kHz quality tier missing' }
          if ($audioQuality -notmatch '_ => 48000') { throw '48 kHz quality tier missing' }
          if ($audioQuality -notmatch 'DefaultReconnectGraceSeconds = 4') { throw 'Reconnect grace default missing' }
          if ($manifest -notmatch '"version": "1.5.2"') { throw 'Manifest version is not 1.5.2' }
          if ($manifest -notmatch '"voice_style"') { throw 'Voice style setting missing from manifest' }
          if ($manifest -notmatch '"downlink_quality"') { throw 'Downlink quality setting missing from manifest' }
          if ($manifest -notmatch '"downlink_gain_percent"') { throw 'Downlink gain setting missing from manifest' }
          if ($manifest -notmatch '"transport_reconnect_grace_seconds"') { throw 'Reconnect grace setting missing from manifest' }
          if ($manifest -notmatch '"end_phrases"') { throw 'End phrase setting missing from manifest' }
          if ($manifest -notmatch '"end_phrase_grace_seconds"') { throw 'End phrase farewell grace setting missing from manifest' }
          if ($manifest -notmatch '"listen_timeout_seconds"') { throw 'Listen timeout setting missing from manifest' }
          if ($manifest -notmatch '"silence_timeout_seconds"') { throw 'Silence timeout setting missing from manifest' }
          if ($manifest -notmatch '"work_timeout_seconds"') { throw 'Work timeout setting missing from manifest' }
          if ($manifest -notmatch '"session_timeout_seconds"') { throw 'Absolute session timeout setting missing from manifest' }
          if ($manifest -match 'btcom|downlink_device|home_assistant_token|audio/mirror|Bluetooth') { throw 'Legacy audio/Bluetooth settings survived in plugin manifest' }
          if ($project -match 'NAudio|System\.Speech|CodexAudioRemote\.Server\.csproj') { throw 'Minimal SOL project pulled legacy audio/TTS dependencies' }
          if ($project -notmatch 'Microsoft\.AspNetCore\.App') { throw 'ASP.NET Core shared framework reference missing for Kestrel' }
          if ($project -notmatch 'SolVoiceSessionSettings\.cs') { throw 'Voice lifecycle settings source is not compiled' }
          if ($project -notmatch 'SolAudioQualitySettings\.cs') { throw 'Audio quality settings source is not compiled' }
          if ($project -match 'AudioPlatformV2|LoopbackDownlink|BtcomBluetoothReconnect|DownlinkDeviceSettings|RealtimeSecondaryAudioMirror|HomeAssistantMediaClient|SessionServerV2|TrayController') { throw 'Minimal SOL project includes legacy audio source' }
          if ($entry -match 'VirtualMic|Cable|Btcom|BluetoothReconnect') { throw 'SOL entrypoint references legacy audio plumbing' }

          Write-Host 'Verified: native V3/WebRTC + Kestrel + 16/24/48 kHz quality + reconnect grace + SOL tools + transcript lifecycle; no URLACL, cable, loopback, Bluetooth or mirror runtime.'

      - name: Publish minimal SOL plugin runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $lines = @()
          & dotnet publish windows/CodexAudioRemote.SolPlugin/CodexAudioRemote.SolPlugin.csproj -c Release -r win-x64 --self-contained true -o dist/sol-plugin 2>&1 | Tee-Object -Variable lines
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            $errors = $lines | ForEach-Object { $_.ToString() } | Where-Object { $_ -match ': error ' -or $_ -match 'error CS\d+' }
            if (-not $errors) { $errors = $lines | Select-Object -Last 80 | ForEach-Object { $_.ToString() } }
            Write-Host (($errors | Select-Object -Last 80) -join "`n")
            exit $exitCode
          }

      - name: Verify published runtime has no legacy audio dependencies
        shell: pwsh
        run: |
          if (-not (Test-Path dist/sol-plugin/CodexAudioRemote.Server.exe)) { throw 'Server executable missing' }
          if (Test-Path dist/sol-plugin/codex.exe) { throw 'Package must not bundle codex.exe' }
          $legacy = Get-ChildItem dist/sol-plugin -File | Where-Object { $_.Name -match 'NAudio|Lame|System\.Speech' }
          if ($legacy) { throw ('Legacy audio dependencies packaged: ' + (($legacy | Select-Object -ExpandProperty Name) -join ', ')) }
          Get-ChildItem dist/sol-plugin -File | Select-Object Name,Length | Format-Table -AutoSize

      - name: Assemble .solplugin package
        shell: pwsh
        run: |
          Copy-Item sol-plugin/sol-plugin.json dist/sol-plugin/sol-plugin.json
          $zip = 'dist/CodexAudioRemote-SOL.zip'
          $plugin = 'dist/CodexAudioRemote.solplugin'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          if (Test-Path $plugin) { Remove-Item $plugin -Force }
          Compress-Archive -Path dist/sol-plugin/* -DestinationPath $zip -CompressionLevel Optimal
          Move-Item $zip $plugin
          Write-Host "Built $plugin"

      - name: Publish stable SOL plugin release asset
        if: github.ref == 'refs/heads/feat/sol-plugin-port'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'sol-plugin-latest'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Codex Audio Remote · SOL Plugin' --notes 'Stable install endpoint for SOL Plugin Manager. Built from the isolated native plugin branch.' --prerelease
          }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --notes 'Stable native SOL plugin 1.5.2: configurable 16/24/48 kHz downlink quality and gain, PAUSED audio playback fix, transport reconnect grace, transcript lifecycle and farewell grace; no virtual cable, loopback, Bluetooth/btcom or HA audio mirror runtime.'
          gh release upload $tag dist/CodexAudioRemote.solplugin --repo $env:GITHUB_REPOSITORY --clobber

      - name: Upload SOL plugin artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: CodexAudioRemote-SOL-Plugin
          path: dist/CodexAudioRemote.solplugin
          if-no-files-found: error