name: build-official-codex-realtime

on:
  push:
    branches: [ fix/official-codex-realtime ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  windows-official-realtime:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Apply captured official Codex realtime flow
        shell: pwsh
        run: ./scripts/prepare-official-realtime.ps1

      - name: Bind persisted runtime settings
        shell: pwsh
        run: ./scripts/apply-runtime-settings.ps1

      - name: Route V3 audio through WebRTC media track
        shell: pwsh
        run: ./scripts/prepare-webrtc-media-audio.ps1

      - name: Instrument WebRTC audio flow
        shell: pwsh
        run: ./scripts/instrument-webrtc-audio.ps1

      - name: Wire Home Assistant speech into Realtime
        shell: pwsh
        run: ./scripts/prepare-realtime-ha-speech.ps1

      - name: Add listening pause lifecycle and secondary mirrors
        shell: pwsh
        run: ./scripts/prepare-realtime-lifecycle-mirrors.ps1

      - name: Fix direct V3 speech and HA Cast stream
        shell: pwsh
        run: ./scripts/prepare-ha-stream-direct-speech-v2.ps1

      - name: Verify official-flow source transform
        shell: pwsh
        run: |
          $bridge = Get-Content windows/CodexAudioRemote.Server/CodexRealtimeBridge.cs -Raw
          $peer = Get-Content windows/CodexAudioRemote.Server/CodexOAuthWebRtcPeer.cs -Raw
          $server = Get-Content windows/CodexAudioRemote.Server/RealtimeSessionServer.cs -Raw
          $program = Get-Content windows/CodexAudioRemote.Server/Program.cs -Raw
          $settings = Get-Content windows/CodexAudioRemote.Server/AppSettings.cs -Raw
          $ui = Get-Content windows/CodexAudioRemote.Server/SettingsForm.cs -Raw
          $haUi = Get-Content windows/CodexAudioRemote.Server/HomeAssistantSettingsPanel.cs -Raw
          $haClient = Get-Content windows/CodexAudioRemote.Server/HomeAssistantMediaClient.cs -Raw
          $haApi = Get-Content windows/CodexAudioRemote.Server/RealtimeHomeAssistantApiServer.cs -Raw
          $mirror = Get-Content windows/CodexAudioRemote.Server/RealtimeSecondaryAudioMirror.cs -Raw
          if ($bridge -notmatch 'RealtimeVersion = "v3"') { throw 'v3 missing' }
          if ($bridge -notmatch 'RealtimeModel = "gpt-live-1-codex"') { throw 'gpt-live-1-codex missing' }
          if ($bridge -notmatch 'RealtimeVoice => AppSettings\.RealtimeVoice') { throw 'settings-backed realtime voice missing' }
          if ($bridge -notmatch 'type = "webrtc"') { throw 'webrtc transport missing' }
          if ($bridge -match 'type = "existingCall"') { throw 'existingCall still present' }
          if ($bridge -match 'directRealtimeCall\.CreateAsync') { throw 'manual realtime/calls still present' }
          if ($bridge -notmatch 'includeStartupContext = false') { throw 'official startup context setting missing' }
          if ($bridge -match 'thread/realtime/appendAudio') { throw 'legacy sideband audio append still present' }
          if ($bridge -match 'thread/realtime/appendSpeech') { throw 'older app-server appendSpeech route still present' }
          if ($bridge -notmatch 'PushSpeakableTextAsync') { throw 'direct V3 speakable bridge route missing' }
          if ($bridge -notmatch 'oauthWebRtcPeer\.PushPcmAsync') { throw 'WebRTC media uplink missing' }
          if ($bridge -notmatch 'oauthWebRtcPeer\.AudioReceived') { throw 'WebRTC media downlink callback missing' }
          if ($bridge -notmatch 'SetInputPausedAsync') { throw 'Realtime pause/resume bridge missing' }
          if ($peer -notmatch 'MediaStreamTrackGenerator') { throw 'WebRTC audio track generator missing' }
          if ($peer -notmatch 'MediaStreamTrackProcessor') { throw 'WebRTC audio track processor missing' }
          if ($peer -notmatch 'input_audio\.resume') { throw 'V3 input_audio.resume missing' }
          if ($peer -notmatch 'input_audio\.pause') { throw 'V3 input_audio.pause missing' }
          if ($peer -notmatch 'session\.context\.append') { throw 'Frameless session.context.append missing' }
          if ($peer -notmatch "channel: 'speakable'") { throw 'Frameless speakable channel missing' }
          if ($peer -notmatch 'rtp-stats') { throw 'RTP diagnostics missing' }
          if ($server -notmatch 'SpeakExternalAsync') { throw 'authoritative external speech method missing' }
          if ($server -notmatch 'AppSettings\.WakeRetryCooldownMs') { throw 'settings-backed wake cooldown missing' }
          if ($server -notmatch '"paused"') { throw 'PAUSED lifecycle missing' }
          if ($server -notmatch 'secondaryMirror\.PushPcm16k') { throw 'secondary mirror fanout missing' }
          if ($program -notmatch 'RealtimeHomeAssistantApiServer') { throw 'Realtime Home Assistant API missing' }
          if ($settings -notmatch '"sol"') { throw 'Sol voice setting missing' }
          if ($ui -notmatch 'HomeAssistantSettingsPanel') { throw 'unified Home Assistant settings tab missing' }
          if ($ui -notmatch 'SecondaryOutputSettingsForm') { throw 'Windows/Bluetooth mirror settings UI missing' }
          if ($ui -notmatch 'RealtimeLifecycleSettingsForm') { throw 'lifecycle settings UI missing' }
          if ($haUi -notmatch 'Probar stream LIVE') { throw 'Home Assistant stream diagnostic UI missing' }
          if ($haUi -notmatch 'PostLocalSpeechTestAsync') { throw 'Home Assistant local /api/speak test missing' }
          if ($haClient -notmatch 'media_content_type = "audio/mp3"') { throw 'Cast audio/mp3 media type missing' }
          if ($haApi -notmatch 'HEAD') { throw 'Cast HEAD probe support missing' }
          if ($haApi -notmatch 'IgnoreWriteExceptions = true') { throw 'Cast disconnect tolerance missing' }
          if ($haApi -notmatch 'IsLoopback') { throw 'localhost API test exemption missing' }
          if ($mirror -notmatch 'Android remains the primary output') { throw 'Android-primary mirror invariant missing' }
          if ($mirror -notmatch 'ResolveLanIPv4ForHomeAssistantAsync') { throw 'HA route-aware LAN IP selection missing' }
          if ($mirror -notmatch 'WaitForGetAsync') { throw 'HA receiver GET verification missing' }
          if ($mirror -notmatch 'BytesServed') { throw 'HA stream byte diagnostics missing' }
          Write-Host 'Official flow verified: V3 + Sol + direct speakable text + PAUSED + unified HA diagnostics + resilient mirrors.'

      - name: Publish Windows companion
        run: dotnet publish windows/CodexAudioRemote.Server/CodexAudioRemote.Server.csproj -c Release -r win-x64 --self-contained false -o dist/official

      - name: Verify stock Codex package
        shell: pwsh
        run: |
          if (-not (Test-Path dist/official/CodexAudioRemote.Server.exe)) { throw 'CodexAudioRemote.Server.exe missing' }
          if (Test-Path dist/official/codex.exe) { throw 'This package must not bundle a modified codex.exe' }
          Get-Item dist/official/CodexAudioRemote.Server.exe | Format-Table Name, Length

      - name: Upload official Codex realtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexAudioRemote-Windows-OfficialCodex-Realtime
          path: dist/official
          if-no-files-found: error
