name: apply-open-vosk-android6

on:
  push:
    branches: [ fix/vosk-wake-hardening ]
    paths: [ '.github/workflows/apply-open-vosk-android6.yml' ]

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vosk-wake-hardening
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Patch Android 6 wake recognizer to free Vosk mode
        shell: python
        run: |
          from pathlib import Path
          p = Path('android/app/src/main/java/com/bwa3d/codexremote/RemoteService.java')
          s = p.read_text(encoding='utf-8')
          old = '''                    recognizer = new Recognizer(voskModel, WAKE_SAMPLE_RATE, wakeGrammar());\n                    recognizer.setWords(true);'''
          new = '''                    // Android 6: use free recognition instead of a tiny constrained grammar.\n                    // A closed grammar can force unrelated speech into the wake phrase; free ASR\n                    // lets Vosk transcribe what it actually hears and VoskWakeGate then performs\n                    // strict exact/progression/final validation.\n                    recognizer = new Recognizer(voskModel, WAKE_SAMPLE_RATE);\n                    recognizer.setWords(true);'''
          if old not in s:
              raise SystemExit('Expected Android 6 recognizer block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Bundle Vosk Spanish wake model
        run: |
          mkdir -p android/app/src/main/assets
          curl -L --fail --retry 3 -o android/app/src/main/assets/vosk-es.zip https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip
      - name: Build Android APK
        run: gradle -p android :app:assembleDebug --stacktrace
      - name: Commit source patch and remove temporary workflow
        run: |
          rm -f android/app/src/main/assets/vosk-es.zip
          rm -f .github/workflows/apply-open-vosk-android6.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/com/bwa3d/codexremote/RemoteService.java .github/workflows/apply-open-vosk-android6.yml
          git commit -m 'Use free Vosk recognition for Android 6 wake'
          git push origin HEAD:fix/vosk-wake-hardening
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexAudioRemote-Android-v2-open-vosk
          path: android/app/build/outputs/apk/debug/app-debug.apk
