name: build

on:
  push:
    branches: [ main, rewrite/state-machine-v2, 'fix/**' ]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Windows companion
        run: dotnet publish windows/CodexAudioRemote.Server/CodexAudioRemote.Server.csproj -c Release -r win-x64 --self-contained false -o dist/windows
      - name: Verify stock Codex package
        if: github.ref == 'refs/heads/experimental/stock-codex-chromium-webrtc' || github.head_ref == 'experimental/stock-codex-chromium-webrtc'
        shell: pwsh
        run: |
          if (Test-Path dist/windows/codex.exe) { throw 'ExistingCall experiment must use stock Codex from PATH and must not bundle codex.exe' }
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexAudioRemote-Windows-x64-v2
          path: dist/windows

  oauth-realtime-windows:
    if: github.ref == 'refs/heads/fix/oauth-webrtc' || github.head_ref == 'fix/oauth-webrtc'
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Codex Audio Remote
        uses: actions/checkout@v4

      - name: Checkout OpenAI Codex
        uses: actions/checkout@v4
        with:
          repository: openai/codex
          ref: 343074d4207d572809bd8cea15f4be1d09d98e0b
          path: upstream-codex

      - name: Apply ChatGPT OAuth WebRTC compatibility patch
        shell: pwsh
        run: git -C upstream-codex apply "$env:GITHUB_WORKSPACE\patches\openai-codex-oauth-webrtc.patch"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream-codex/codex-rs

      - name: Build patched Codex CLI
        working-directory: upstream-codex/codex-rs
        run: cargo build --release -p codex-cli --bin codex

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Windows companion
        run: dotnet publish windows/CodexAudioRemote.Server/CodexAudioRemote.Server.csproj -c Release -r win-x64 --self-contained false -o dist/windows

      - name: Bundle patched Codex CLI
        shell: pwsh
        run: Copy-Item -LiteralPath upstream-codex/codex-rs/target/release/codex.exe -Destination dist/windows/codex.exe

      - name: Verify OAuth realtime bundle
        shell: pwsh
        run: |
          if (-not (Test-Path dist/windows/CodexAudioRemote.Server.exe)) { throw 'CodexAudioRemote.Server.exe missing' }
          if (-not (Test-Path dist/windows/codex.exe)) { throw 'patched codex.exe missing' }
          Get-Item dist/windows/CodexAudioRemote.Server.exe, dist/windows/codex.exe | Format-Table Name, Length

      - name: Upload Windows OAuth Realtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexAudioRemote-Windows-OAuthRealtime
          path: dist/windows
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Wire Android PAUSED lifecycle and audio cues
        run: python3 scripts/prepare-android-audio-cues.py
      - name: Make end phrases pause listening
        run: python3 scripts/fix-android-end-phrases-pause.py
      - name: Wire fullscreen wake GIF overlay
        run: python3 scripts/prepare-android-wake-gif-overlay.py
      - name: Verify Android PAUSED lifecycle, cues and wake GIF overlay
        run: |
          grep -q 'AudioCuePlayer.Cue.WAKE' android/app/src/main/java/com/bwa3d/codexremote/RemoteService.java
          grep -q 'AudioCuePlayer.Cue.UPLINK' android/app/src/main/java/com/bwa3d/codexremote/RemoteService.java
          grep -q 'AudioCuePlayer.Cue.LISTEN_END' android/app/src/main/java/com/bwa3d/codexremote/RemoteService.java
          grep -q 'AudioCuePlayer.Cue.END' android/app/src/main/java/com/bwa3d/codexremote/RemoteService.java
          grep -q 'isWakeState(serverState)' android/app/src/main/java/com/bwa3d/codexremote/RemoteService.java
          grep -q 'En espera · decí Hola Sol' android/app/src/main/java/com/bwa3d/codexremote/RemoteService.java
          grep -q 'suggestedSuppressionMs' android/app/src/main/java/com/bwa3d/codexremote/RemoteService.java
          grep -q 'sendPauseEvent("phrase")' android/app/src/main/java/com/bwa3d/codexremote/RemoteService.java
          grep -q 'event\\\":\\\"pause' android/app/src/main/java/com/bwa3d/codexremote/RemoteService.java
          grep -q 'wakeGifOverlay.showWake' android/app/src/main/java/com/bwa3d/codexremote/RemoteService.java
          grep -q 'wakeGifOverlay.onServerState' android/app/src/main/java/com/bwa3d/codexremote/RemoteService.java
          grep -q 'FADE_MS = 240L' android/app/src/main/java/com/bwa3d/codexremote/WakeGifOverlayController.java
          grep -q 'Movie.decodeStream' android/app/src/main/java/com/bwa3d/codexremote/WakeGifOverlayController.java
          grep -q 'ACTION_OPEN_DOCUMENT' android/app/src/main/java/com/bwa3d/codexremote/WakeGifPickerActivity.java
          grep -q 'wake_gif_bg_color' android/app/src/main/java/com/bwa3d/codexremote/WakeGifPrefs.java
          grep -q 'WakeGifSettingsView' android/app/src/main/res/layout/activity_main.xml
          grep -q 'WakeGifPickerActivity' android/app/src/main/AndroidManifest.xml
          grep -q 'LISTEN_END' android/app/src/main/java/com/bwa3d/codexremote/AudioCuePlayer.java
          grep -q 'ACTION_OPEN_DOCUMENT' android/app/src/main/java/com/bwa3d/codexremote/AudioCuePickerActivity.java
          grep -q 'cue_listen_end_uri' android/app/src/main/java/com/bwa3d/codexremote/AudioCuePlayer.java
      - name: Bundle Vosk Spanish wake model
        run: |
          mkdir -p android/app/src/main/assets
          curl -L --fail --retry 3 -o android/app/src/main/assets/vosk-es.zip https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip
          ls -lh android/app/src/main/assets/vosk-es.zip
      - name: Build Android debug APK
        run: gradle -p android :app:assembleDebug --stacktrace
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexAudioRemote-Android-v2
          path: android/app/build/outputs/apk/debug/app-debug.apk
