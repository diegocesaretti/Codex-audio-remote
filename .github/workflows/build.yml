name: build

on:
  push:
    branches: [ main, rewrite/state-machine-v2, 'fix/**' ]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Windows companion
        run: dotnet publish windows/CodexAudioRemote.Server/CodexAudioRemote.Server.csproj -c Release -r win-x64 --self-contained false -o dist/windows
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexAudioRemote-Windows-x64-v2
          path: dist/windows

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle Vosk Spanish wake model
        run: |
          mkdir -p android/app/src/main/assets
          curl -L --fail --retry 3 -o android/app/src/main/assets/vosk-es.zip https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip
          ls -lh android/app/src/main/assets/vosk-es.zip
      - name: Build Android debug APK
        run: gradle -p android :app:assembleDebug --stacktrace
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexAudioRemote-Android-v2
          path: android/app/build/outputs/apk/debug/app-debug.apk


  kinect-satellite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install satellite Python dependencies
        run: pip install -r codex-kinect-satellite/requirements.txt
      - name: Compile satellite
        run: python -m py_compile codex-kinect-satellite/satellite.py
      - name: Synthetic GCC-PHAT delay check
        run: |
          python - <<'PY'
          import importlib.util
          import numpy as np
          spec=importlib.util.spec_from_file_location("sat","codex-kinect-satellite/satellite.py")
          sat=importlib.util.module_from_spec(spec); spec.loader.exec_module(sat)
          rng=np.random.default_rng(4)
          x=rng.normal(0,1,8192)
          X=np.fft.rfft(x); f=np.fft.rfftfreq(len(x),1/sat.RATE)
          X[(f<300)|(f>4000)]=0; x=np.fft.irfft(X)
          for delay in (-8,-3,4,9):
              d,sharp=sat.gcc_phat(np.roll(x,delay),x)
              assert abs(d-delay)<0.6, (delay,d,sharp)
          print("GCC-PHAT synthetic delay test passed")
          PY
      - name: Probe current Microsoft Kinect SDK hashes
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          curl -L --fail --retry 3 -o /tmp/KinectSDK-v1.0-beta2-x86.msi https://download.microsoft.com/download/F/9/9/F99791F2-D5BE-478A-B77A-830AD14950C3/KinectSDK-v1.0-beta2-x86.msi
          md5sum /tmp/KinectSDK-v1.0-beta2-x86.msi
          sha256sum /tmp/KinectSDK-v1.0-beta2-x86.msi
          mkdir -p /tmp/kinect-fw
          cd /tmp/kinect-fw
          7z e -y -r /tmp/KinectSDK-v1.0-beta2-x86.msi "UACFirmware.*"
          ls -l UACFirmware.*
          sha256sum UACFirmware.*
      - name: Build Home Assistant app container
        run: docker build -t codex-kinect-satellite:test codex-kinect-satellite
