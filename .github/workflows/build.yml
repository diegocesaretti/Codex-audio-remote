name: build

on:
  push:
    branches: [ main, rewrite/state-machine-v2, 'fix/**' ]
  pull_request:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Windows companion
        run: dotnet publish windows/CodexAudioRemote.Server/CodexAudioRemote.Server.csproj -c Release -r win-x64 --self-contained false -o dist/windows
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexAudioRemote-Windows-x64-v2
          path: dist/windows

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Use free Vosk recognition on Android 6
        if: github.ref == 'refs/heads/fix/vosk-wake-hardening'
        shell: python
        run: |
          from pathlib import Path
          p = Path('android/app/src/main/java/com/bwa3d/codexremote/RemoteService.java')
          s = p.read_text(encoding='utf-8')
          if 'recognizer = new Recognizer(voskModel, WAKE_SAMPLE_RATE);' in s:
              print('Android 6 free Vosk mode already applied')
          else:
              old = '''                    recognizer = new Recognizer(voskModel, WAKE_SAMPLE_RATE, wakeGrammar());\n                    recognizer.setWords(true);'''
              new = '''                    // Android 6: free recognition avoids constrained-grammar hallucinations.\n                    // VoskWakeGate performs exact/progression/final validation afterwards.\n                    recognizer = new Recognizer(voskModel, WAKE_SAMPLE_RATE);\n                    recognizer.setWords(true);'''
              if old not in s:
                  raise SystemExit('Expected Android 6 recognizer block not found')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
      - name: Bundle Vosk Spanish wake model
        run: |
          mkdir -p android/app/src/main/assets
          curl -L --fail --retry 3 -o android/app/src/main/assets/vosk-es.zip https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip
          ls -lh android/app/src/main/assets/vosk-es.zip
      - name: Build Android debug APK
        run: gradle -p android :app:assembleDebug --stacktrace
      - name: Commit Android 6 free Vosk source
        if: github.ref == 'refs/heads/fix/vosk-wake-hardening'
        run: |
          rm -f android/app/src/main/assets/vosk-es.zip
          if git diff --quiet -- android/app/src/main/java/com/bwa3d/codexremote/RemoteService.java; then
            echo 'No source change to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/com/bwa3d/codexremote/RemoteService.java
          git commit -m 'Use free Vosk recognition for Android 6 wake'
          git push origin HEAD:fix/vosk-wake-hardening
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexAudioRemote-Android-v2
          path: android/app/build/outputs/apk/debug/app-debug.apk
