name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Windows companion
        run: dotnet publish windows/CodexAudioRemote.Server/CodexAudioRemote.Server.csproj -c Release -r win-x64 --self-contained false -o dist/windows
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexAudioRemote-Windows-x64
          path: dist/windows

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android debug APK
        run: gradle -p android :app:assembleDebug --stacktrace
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexAudioRemote-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
