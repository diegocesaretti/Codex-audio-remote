name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply graceful voice end patch
        run: python tools/apply_graceful_end.py
      - name: Temporarily hide System.Speech from legacy patch
        run: python -c "from pathlib import Path; p=Path('windows/CodexAudioRemote.Server/CodexAudioRemote.Server.csproj'); s=p.read_text(); s=s.replace('    <PackageReference Include=\"System.Speech\" Version=\"8.0.0\" />\n',''); p.write_text(s)"
      - name: Apply smart Codex UI state patch
        run: python tools/apply_smart_ui_state.py
      - name: Restore System.Speech package
        run: python -c "from pathlib import Path; p=Path('windows/CodexAudioRemote.Server/CodexAudioRemote.Server.csproj'); s=p.read_text(); marker='    <PackageReference Include=\"NAudio\" Version=\"2.3.0\" />\n'; s=s.replace(marker, marker+'    <PackageReference Include=\"System.Speech\" Version=\"8.0.0\" />\n',1); p.write_text(s)"
      - name: Use MSAA accessibility detector
        run: python tools/replace_uia_with_msaa.py
      - name: Fix smart close scope
        run: python tools/fix_smart_scope.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Windows companion
        run: dotnet publish windows/CodexAudioRemote.Server/CodexAudioRemote.Server.csproj -c Release -r win-x64 --self-contained false -o dist/windows
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexAudioRemote-Windows-x64
          path: dist/windows

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply graceful voice end patch
        run: python tools/apply_graceful_end.py
      - name: Temporarily hide System.Speech from legacy patch
        run: python -c "from pathlib import Path; p=Path('windows/CodexAudioRemote.Server/CodexAudioRemote.Server.csproj'); s=p.read_text(); s=s.replace('    <PackageReference Include=\"System.Speech\" Version=\"8.0.0\" />\n',''); p.write_text(s)"
      - name: Apply smart Codex UI state patch
        run: python tools/apply_smart_ui_state.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle Vosk Spanish wake model
        run: |
          mkdir -p android/app/src/main/assets
          curl -L --fail --retry 3 -o android/app/src/main/assets/vosk-es.zip https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip
          ls -lh android/app/src/main/assets/vosk-es.zip
      - name: Build Android debug APK
        run: gradle -p android :app:assembleDebug --stacktrace
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexAudioRemote-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
