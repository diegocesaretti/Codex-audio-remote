name: Build Stock Codex Chromium WebRTC

on:
  push:
    branches:
      - experimental/stock-codex-chromium-webrtc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Windows companion
        run: dotnet publish windows/CodexAudioRemote.Server/CodexAudioRemote.Server.csproj -c Release -r win-x64 --self-contained false -o dist/windows

      - name: Add experiment notes
        shell: pwsh
        run: |
          @'
          STOCK CODEX + CHROMIUM WEBRTC + EXISTING CALL EXPERIMENT

          This package intentionally does NOT contain codex.exe.
          It uses the official Codex CLI from PATH and the existing ChatGPT OAuth login.

          Flow:
            Chromium creates SDP offer
            Companion creates realtime/calls directly with OAuth and no session.model
            Chromium applies the SDP answer
            Stock Codex attaches with transport existingCall + callId

          Before testing:
            codex login

          OAuth tokens are read from the local Codex auth.json only after Codex refreshes them.
          They are never logged or stored by Codex Audio Remote.
          '@ | Set-Content -Encoding UTF8 dist/windows/STOCK-CODEX-CHROMIUM-WEBRTC.txt

      - name: Verify package
        shell: pwsh
        run: |
          if (-not (Test-Path dist/windows/CodexAudioRemote.Server.exe)) { throw 'Server executable missing' }
          if (Test-Path dist/windows/codex.exe) { throw 'Stock Codex existingCall experiment must not bundle codex.exe' }
          Get-ChildItem dist/windows | Select-Object Name, Length | Format-Table

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexAudioRemote-Windows-StockCodex-ExistingCall
          path: dist/windows
          if-no-files-found: error
