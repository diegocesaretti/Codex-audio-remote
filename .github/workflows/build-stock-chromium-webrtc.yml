name: Build Stock Codex Chromium WebRTC

on:
  push:
    branches:
      - experimental/stock-codex-chromium-webrtc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Windows companion
        run: dotnet publish windows/CodexAudioRemote.Server/CodexAudioRemote.Server.csproj -c Release -r win-x64 --self-contained false -o dist/windows

      - name: Publish official Codex compatibility launcher
        shell: pwsh
        run: |
          dotnet publish windows/CodexCompatibilityLauncher/CodexCompatibilityLauncher.csproj -c Release -r win-x64 --self-contained false -o dist/codex-shim
          Copy-Item -Path dist/codex-shim/* -Destination dist/windows -Force
          Remove-Item dist/codex-shim -Recurse -Force

      - name: Add experiment notes
        shell: pwsh
        run: |
          @'
          OFFICIAL CODEX + CHROMIUM WEBRTC COMPATIBILITY EXPERIMENT

          This package includes a small codex.exe launcher, NOT a forked Codex build.
          The launcher locates your installed official Codex executable, copies it to
          a local compatibility cache, and changes only the equal-length realtime
          alpha marker quicksilver=v1 -> quicksilver=v2 in that temporary copy.
          Your installed Codex executable and OAuth credentials are not modified.

          Before testing:
            codex login

          Chromium/WebView2 creates the RTCPeerConnection. Android PCM still uses
          app-server appendAudio/outputAudio sideband notifications.
          '@ | Set-Content -Encoding UTF8 dist/windows/STOCK-CODEX-CHROMIUM-WEBRTC.txt

      - name: Verify package
        shell: pwsh
        run: |
          if (-not (Test-Path dist/windows/CodexAudioRemote.Server.exe)) { throw 'Server executable missing' }
          if (-not (Test-Path dist/windows/codex.exe)) { throw 'Codex compatibility launcher missing' }
          Get-ChildItem dist/windows | Select-Object Name, Length | Format-Table

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexAudioRemote-Windows-StockCodex-ChromiumWebRTC
          path: dist/windows
          if-no-files-found: error
