plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bwa3d.codexremote'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bwa3d.codexremote'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

configurations.all {
    resolutionStrategy {
        // JNA 5.18.x contains Java-generated synthetic lambda classes in Structure
        // that fail during static initialization on this API 23 Sony ROM.
        // Vosk only needs the stable native/JNA API, so pin the older Android-safe line.
        force 'net.java.dev.jna:jna:5.13.0'
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
    implementation('com.alphacephei:vosk-android:0.3.75@aar') {
        exclude group: 'net.java.dev.jna', module: 'jna'
    }
}
